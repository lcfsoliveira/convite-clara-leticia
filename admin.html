<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel • Clara Letícia</title><style>body{margin:0;background:#fffaf0;color:#594d3b;font-family:Arial,sans-serif}.admin{max-width:1200px;margin:auto;padding:28px}.admin h1{color:#b47e13}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0}.stats div{background:#fff;border:1px solid #eadcb8;border-radius:18px;padding:16px}.stats b{display:block;font-size:30px;color:#b47e13}input{padding:12px;width:100%;border:1px solid #dfd3b8;border-radius:10px}table{width:100%;border-collapse:collapse;background:#fff;margin:18px 0}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:12px}button{border:0;border-radius:10px;padding:9px 13px;background:#f3ead3;color:#6d541d;font-weight:600}@media(max-width:650px){.stats{grid-template-columns:1fr}.admin{padding:15px}}</style></head><body><main class="admin"><h1>🌼 Painel de Convidados</h1><p>Clara Letícia • 1 aninho • 18/10/2026 • 09:00 • Mansão Aliete Vieira, Farolândia</p><div class="stats"><div><b id="r">0</b>Respostas</div><div><b id="c">0</b>Confirmados</div><div><b id="a">0</b>Adultos</div><div><b id="k">0</b>Crianças</div></div><input id="busca" placeholder="Pesquisar convidado..."><table><thead><tr><th>Convidado</th><th>Status</th><th>Crianças</th><th>Acompanhante</th><th>WhatsApp</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table><button onclick="window.print()">Imprimir</button> <button id="csv">Exportar CSV</button><p><a href="index.html">Voltar ao convite</a></p></main><script>const key='clara_rsvp_v1';let d=JSON.parse(localStorage.getItem(key)||'[]');const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(){const q=(busca.value||'').toLowerCase(),x=d.filter(v=>v.nome.toLowerCase().includes(q));r.textContent=d.length;c.textContent=d.filter(v=>v.presenca==='sim').length;a.textContent=d.filter(v=>v.presenca==='sim').reduce((s,v)=>s+1+(v.acomp==='sim'?1:0),0);k.textContent=d.reduce((s,v)=>s+(v.qtd||0),0);lista.innerHTML=x.map(v=>'<tr><td>'+esc(v.nome)+'</td><td>'+(v.presenca==='sim'?'Confirmado':'Não irá')+'</td><td>'+(v.qtd||0)+'</td><td>'+esc(v.nomeAcomp||'-')+'</td><td>'+esc(v.whatsapp||'-')+'</td><td><button onclick="del('+v.id+')">Excluir</button></td></tr>').join('')}function del(id){if(confirm('Excluir esta resposta?')){d=d.filter(v=>v.id!==id);localStorage.setItem(key,JSON.stringify(d));render()}}busca.oninput=render;csv.onclick=()=>{let s='Nome;Status;Crianças;Acompanhante;WhatsApp;Email\n'+d.map(v=>[v.nome,v.presenca,v.qtd,v.nomeAcomp,v.whatsapp,v.email].map(x=>'"'+String(x||'').replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download='convidados-clara-leticia.csv';a.click()};render();</script></body></html>
